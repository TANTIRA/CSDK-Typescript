# Publishes @convergehq/sdk to npm when a v* tag is pushed, through npm trusted publishing
# (OIDC, with provenance): no npm token is stored anywhere. See RELEASING.md for the one-time
# setup, which only an owner of the npm organization can do.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
      - name: Tag matches the package version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: package
          path: "*.tgz"

  publish:
    needs: build
    # skipped (not failed) until a maintainer sets the repository variable
    # NPM_TRUSTED_PUBLISHING=true after configuring the trusted publisher
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: package
      - name: Publish
        run: npm publish ./*.tgz --access public --provenance
